description: Phoenix Tailings is a clean rare earth and critical minerals refining company working to
  restore U.S. industrial independence by building domestic refining capacity for the metals behind every
  major technology. It recovers rare earth elements and other critical minerals from mining waste (tailings)
  and low-grade feedstocks using a low-emission, zero-landfill process, supplying materials for medical
  devices, electric vehicles and automotive systems, electronics, and defense applications. The company
  operates as a materials producer and does not currently publish a public developer API, SDK, or developer
  portal; this API Evangelist profile tracks its identity and web/domain security posture.
